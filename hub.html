<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>HALBI METAL — Member Hub</title></head>
<body class="portal-body"><header class="portal-header"><a href="./"><img src="./logos/halbimetal-logo-black.png" alt="HALBI METAL"></a><div><span class="system-label">HALBI METAL</span><strong>BAND OS</strong></div><nav><a href="./">PUBLIC</a><a href="./admin.html">ADMIN</a></nav></header>
<main class="hub-shell"><section class="hub-hero"><div><p class="eyebrow">MEMBER HUB / DASHBOARD</p><h1>READY TO<br><em>REHEARSE?</em></h1></div><div class="clock"><span id="today-label"></span><strong id="clock-time"></strong></div></section>
<section class="hub-grid"><article class="panel rehearsal-card"><div class="panel-heading"><div><p class="kicker">NEXT REHEARSAL</p><h2 id="rehearsal-date">일정 준비 중</h2></div><span class="status-dot">UPCOMING</span></div><p class="venue" id="rehearsal-venue">장소를 등록해주세요.</p><p id="rehearsal-note"></p><div class="rsvp" aria-label="합주 참석 응답"><button data-rsvp="참석">참석</button><button data-rsvp="지각">지각</button><button data-rsvp="불참">불참</button></div><p class="feedback" id="rsvp-feedback" role="status"></p></article>
<article class="panel quick-card"><p class="kicker">TODAY</p><h2>QUICK ACCESS</h2><div class="quick-links"><a href="#setlist">SETLIST <span>→</span></a><a href="#songs">BACKING TRACK <span>→</span></a><a href="#board">BULLETIN <span>→</span></a><a href="#chat">MEMBER TALK <span>→</span></a></div></article></section>
<section class="panel" id="setlist"><div class="panel-heading"><div><p class="kicker">THIS WEEK SETLIST</p><h2>연습 곡</h2></div><span class="count" id="hub-song-count">0 TRACKS</span></div><div id="setlist-list" class="setlist"></div></section>
<section class="hub-grid"><article class="panel" id="board"><p class="kicker">BULLETIN</p><h2>공지사항</h2><div id="notice-list" class="notice-list"></div></article><article class="panel" id="chat"><p class="kicker">MEMBER TALK</p><h2>멤버 소통</h2><form id="post-form" class="post-form"><input required name="author" placeholder="이름 / 파트"><textarea required name="message" rows="3" placeholder="멤버들에게 전할 내용을 남겨주세요."></textarea><button class="metal-button" type="submit">메시지 남기기</button></form><div id="post-list" class="post-list"></div></article></section>
</main><script type="module" src="/src/hub.js"></script></body></html>
